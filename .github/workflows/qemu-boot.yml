name: Mintosh QEMU boot verification

on:
  workflow_run:
    workflows: ["Mintosh verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-boot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build image and verify live boot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install build dependencies
        run: make host-deps
      - name: Verify native foundation
        run: make verify
      - name: Fetch and configure pinned Linux kernel
        run: |
          make kernel-fetch
          make kernel-config
      - name: Build kernel and installer image
        run: |
          make kernel JOBS=2
          make iso JOBS=2
      - name: Boot installer image in QEMU
        run: make test-qemu
      - name: Upload boot image and serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintosh-qemu-boot-${{ github.run_number }}
          path: |
            out/mintosh-x86_64.iso
            out/qemu-boot.log
          if-no-files-found: warn
          retention-days: 7
