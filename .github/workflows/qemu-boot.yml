name: Mintosh QEMU boot verification

on:
  workflow_run:
    workflows: ["Mintosh verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Several verification runs can finish for the same commit. Only build one ISO
# for a given source revision so concurrent kernel builds do not waste runners.
concurrency:
  group: mintosh-qemu-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  qemu-boot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build image and verify live boot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install build dependencies
        run: make host-deps
      - name: Verify native foundation
        run: make verify
      - name: Verify HP ProBook and generic hardware configurations
        run: |
          make kernel-fetch
          make kernel-config MINTOSH_HARDWARE_PROFILE=hp-probook-450-g6
          make kernel-config MINTOSH_HARDWARE_PROFILE=generic
      - name: Build kernel and installer image
        run: |
          make kernel JOBS=2
          make iso JOBS=2
      - name: Boot installer image in QEMU
        run: make test-qemu
      - name: Package ISO and SHA-256 checksum
        if: success()
        run: |
          sha256sum out/mintosh-x86_64.iso > out/SHA256SUMS
          (cd out && zip -q mintosh-x86_64.zip mintosh-x86_64.iso SHA256SUMS)
      - name: Upload boot image, installer package and serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintosh-qemu-boot-${{ github.run_number }}
          path: |
            out/mintosh-x86_64.iso
            out/mintosh-x86_64.zip
            out/SHA256SUMS
            out/qemu-boot.log
          if-no-files-found: warn
          retention-days: 7
